apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-demo-html
  namespace: default
data:
  index.html.template: |
    <!DOCTYPE html>
    <html>
    <head><title>EKS Nginx Demo</title></head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 100px;">
      <h1>Hello from EKS</h1>
      <p><strong>Served by pod:</strong> ${POD_NAME}</p>
      <p><strong>Node:</strong> ${NODE_NAME}</p>
    </body>
    </html>
