---
- name: Restart ssh service (Ubuntu)
  service:
    name: ssh
    state: restarted
  when: ansible_os_family == "Debian"

- name: Restart sshd service (Amazon Linux)
  service:
    name: sshd
    state: restarted
  when: ansible_os_family == "RedHat"

- name: Restart fail2ban
  service:
    name: fail2ban
    state: restarted
