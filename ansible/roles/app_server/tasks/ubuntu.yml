---
- name: Install Node.js and Nginx (Ubuntu)
  apt:
    name:
      - nodejs
      - npm
      - nginx
    state: present
    update_cache: yes

- name: Deploy Nginx reverse proxy site configuration (Ubuntu)
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Ensure Nginx service is running and enabled (Ubuntu)
  service:
    name: nginx
    state: started
    enabled: yes
