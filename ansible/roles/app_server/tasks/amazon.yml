---
- name: Install Node.js and Nginx (Amazon Linux)
  dnf:
    name:
      - nodejs
      - nginx
    state: present

- name: Deploy Nginx reverse proxy site configuration (Amazon Linux)
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Ensure Nginx service is running and enabled (Amazon Linux)
  service:
    name: nginx
    state: started
    enabled: yes
